name: "Build Android APK"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickenandpork/godot-export-action@v1
        with:
          godot_version: "4.2.1"
          preset: "Android"
          project_directory: "."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PentagonKingdoms-Game
          path: "**/*.apk"
          
